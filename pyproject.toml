[project]
name = "steerable"
version = "0.1.0"
description = "Steer a training run from Postgres: typed, rate-limited, auditable config changes a trainer applies live, with a credential an LLM can hold safely"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "George Pearse" }]
keywords = ["training", "postgres", "llm", "mcp", "detr", "hyperparameters"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Database",
]
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
mcp = ["mcp>=2"]
tune = ["anthropic>=0.40"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "mcp>=2",
  "anthropic>=0.40",
  "torch>=2.1",
  "numpy>=1.26",
]

[project.scripts]
steerable = "steerable.cli:main"
steerable-mcp = "steerable.mcp_server:main"

[project.urls]
Homepage = "https://github.com/GeorgePearse/steerable"
Issues = "https://github.com/GeorgePearse/steerable/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steerable"]

[tool.uv]
# CPU wheels only: there is no GPU requirement anywhere in this project.
index = [{ name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true }]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src/steerable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs the real upstream package (rfdetr / D-FINE) installed",
]
